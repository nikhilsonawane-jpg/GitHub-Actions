name: first workflow

on:
  push:
    branches:
      - main

jobs:
  job_one:
    runs-on: ubuntu-latest
    outputs:
      my_version: ${{ steps.step1.outputs.version }}
    steps:
      - id: step1
        run: echo "version=1.0.5" >> $GITHUB_OUTPUT

  job_two:
    runs-on: ubuntu-latest
    needs: job_one
    steps:
      - run: echo "Deploying version ${{ needs.job_one.outputs.my_version }}"
