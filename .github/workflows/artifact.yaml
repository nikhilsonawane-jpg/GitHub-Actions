name: Real Pipeline

on: 
  workflow_dispatched

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}

    steps:
      - id: v
        run: echo "version=2.0.0" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - run: echo "Building version ${{ needs.version.outputs.version }}" > build.txt

      - uses: actions/upload-artifact@v4
        with:
          name: build-file
          path: build.txt

  deploy:
    runs-on: ubuntu-latest
    needs: [version, build]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-file

      - run: |
          echo "Deploying version ${{ needs.version.outputs.version }}"
          cat build.txt
